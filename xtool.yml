version: 1
bundleID: com.hotwheelz3000.ThreadCards
# The SwiftPM product used as the app. Also names the built .app/.ipa.
product: ThreadCards
# Merged into the generated Info.plist (version, Photos permission, dark UI).
infoPath: ThreadCards-Info.plist
# 1024x1024 opaque PNG (stacked cards).
iconPath: Resources/AppIcon.png
# Bai Jamjuree (SIL Open Font License, Resources/Fonts/OFL.txt), copied to the app bundle root.
resources:
  - Resources/Fonts/BaiJamjuree-Regular.ttf
  - Resources/Fonts/BaiJamjuree-Medium.ttf
  - Resources/Fonts/BaiJamjuree-SemiBold.ttf
  - Resources/Fonts/BaiJamjuree-Bold.ttf
